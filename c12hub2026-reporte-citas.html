*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f3;color:#1a1a1a;font-size:14px;}
header{background:#fff;border-bottom:1px solid #e5e5e3;padding:14px 24px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:100;}
header h1{font-size:17px;font-weight:600;}
header p{font-size:11px;color:#888;margin-top:1px;}
.hbadge{background:#eef2ff;color:#3730a3;font-size:11px;font-weight:600;padding:3px 10px;border-radius:99px;margin-left:auto;white-space:nowrap;}
.main{max-width:1140px;margin:0 auto;padding:20px 16px;}
.nav-tabs{display:flex;gap:6px;margin-bottom:20px;border-bottom:1px solid #e5e5e3;padding-bottom:0;}
.nav-tab{padding:8px 18px;border-radius:8px 8px 0 0;border:1px solid transparent;background:transparent;color:#888;font-size:13px;font-weight:500;cursor:pointer;margin-bottom:-1px;}
.nav-tab.active{background:#fff;color:#1a1a1a;border-color:#e5e5e3;border-bottom-color:#fff;}
.summary-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:20px;}
.metric{background:#fff;border:1px solid #e5e5e3;border-radius:10px;padding:12px 14px;}
.metric-label{font-size:10px;color:#888;text-transform:uppercase;letter-spacing:.04em;margin-bottom:5px;}
.metric-value{font-size:24px;font-weight:600;}
.green{color:#15803d;}.amber{color:#b45309;}.red{color:#b91c1c;}.blue{color:#1d4ed8;}.purple{color:#6d28d9;}
.controls{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;align-items:center;}
.controls input[type=search]{flex:1;min-width:180px;padding:7px 11px;border-radius:8px;border:1px solid #d4d4d0;font-size:13px;outline:none;}
.controls select{padding:7px 11px;border-radius:8px;border:1px solid #d4d4d0;font-size:13px;cursor:pointer;outline:none;background:#fff;}
.result-count{font-size:12px;color:#888;margin-left:auto;white-space:nowrap;}
.company-card{background:#fff;border:1px solid #e5e5e3;border-radius:10px;margin-bottom:7px;overflow:hidden;}
.company-header{display:flex;align-items:center;gap:10px;padding:11px 14px;cursor:pointer;user-select:none;}
.company-left{flex:1;min-width:0;}
.company-name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.company-sub{font-size:11px;color:#888;margin-top:1px;}
.group-tag{display:inline-block;font-size:10px;font-weight:600;padding:1px 6px;border-radius:4px;margin-left:6px;vertical-align:middle;}
.tag-biz{background:#f3f4f6;color:#374151;}.tag-sp10{background:#ede9fe;color:#4c1d95;}.tag-sp15{background:#d1fae5;color:#065f46;}.tag-buyer{background:#dbeafe;color:#1e3a8a;}
.pills{display:flex;gap:4px;flex-wrap:wrap;align-items:center;}
.pill{font-size:10px;font-weight:600;padding:2px 8px;border-radius:99px;white-space:nowrap;}
.pill-a{background:#dcfce7;color:#15803d;}.pill-p{background:#fef3c7;color:#92400e;}.pill-c{background:#fee2e2;color:#991b1b;}.pill-r{background:#fce7f3;color:#9d174d;}.pill-t{background:#f3f4f6;color:#374151;}
.chevron{font-size:13px;color:#aaa;margin-left:4px;transition:transform .2s;flex-shrink:0;}
.chevron.open{transform:rotate(180deg);}
.persons-wrap{border-top:1px solid #f0f0ee;overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:12px;}
thead tr{background:#fafaf9;}
th{text-align:left;padding:7px 13px;font-size:10px;font-weight:600;color:#888;border-bottom:1px solid #f0f0ee;white-space:nowrap;}
td{padding:7px 13px;border-bottom:1px solid #f7f7f6;}
tr:last-child td{border-bottom:none;}
tr:hover td{background:#fafaf9;}
.num{text-align:center;font-variant-numeric:tabular-nums;font-weight:500;}
.num-a{color:#15803d;}.num-p{color:#b45309;}.num-c{color:#b91c1c;}.num-r{color:#9d174d;}
.empty{text-align:center;padding:36px;color:#aaa;font-size:13px;}
.section-label{font-size:10px;font-weight:600;color:#aaa;text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px;}
/* RSVP styles */
.block-title{font-size:12px;font-weight:700;color:#888;text-transform:uppercase;letter-spacing:.06em;margin:20px 0 10px;padding-bottom:6px;border-bottom:1px solid #e5e5e3;}
.block-title:first-child{margin-top:0;}
.event-card{background:#fff;border:1px solid #e5e5e3;border-radius:10px;margin-bottom:7px;overflow:hidden;}
.event-header{display:flex;align-items:center;gap:12px;padding:12px 16px;cursor:pointer;user-select:none;}
.event-left{flex:1;min-width:0;}
.event-name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.event-meta{font-size:11px;color:#888;margin-top:2px;}
.fill-wrap{display:flex;align-items:center;gap:10px;min-width:200px;}
.fill-bar-bg{flex:1;height:8px;background:#f0f0ee;border-radius:99px;overflow:hidden;}
.fill-bar{height:100%;border-radius:99px;transition:width .3s;}
.fill-label{font-size:12px;font-weight:600;min-width:70px;text-align:right;white-space:nowrap;}
.fill-count{font-size:11px;color:#888;white-space:nowrap;}
.status-badge{font-size:10px;font-weight:700;padding:3px 8px;border-radius:99px;white-space:nowrap;}
.status-full{background:#fee2e2;color:#991b1b;}
.status-almost{background:#fef3c7;color:#92400e;}
.status-open{background:#dcfce7;color:#15803d;}
.group-pills{display:flex;gap:4px;flex-wrap:wrap;}
.gpill{font-size:10px;font-weight:600;padding:2px 7px;border-radius:99px;white-space:nowrap;}
.gpill-buyer{background:#dbeafe;color:#1e3a8a;}
.gpill-biz{background:#f3f4f6;color:#374151;}
.gpill-sp15{background:#d1fae5;color:#065f46;}
.gpill-sp10{background:#ede9fe;color:#4c1d95;}
.gpill-staff{background:#fef3c7;color:#92400e;}
.gpill-other{background:#f3f4f6;color:#374151;}
.rsvp-summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(115px,1fr));gap:10px;margin-bottom:20px;}
.rsvp-controls{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;align-items:center;}
.rsvp-controls input[type=search]{flex:1;min-width:180px;padding:7px 11px;border-radius:8px;border:1px solid #d4d4d0;font-size:13px;outline:none;background:#fff;}
.rsvp-controls select{padding:7px 11px;border-radius:8px;border:1px solid #d4d4d0;font-size:13px;cursor:pointer;outline:none;background:#fff;}
@media(max-width:600px){.fill-wrap{min-width:120px;}.pills{display:none;}.metric-value{font-size:20px;}}

</style>

function agg(persons){
  var map={};
  persons.forEach(function(p){
    var k=p.company+'||'+p.group;
    if(!map[k]) map[k]={company:p.company,group:p.group,Accepted:0,Pending:0,Cancelled:0,Rejected:0,Rescheduled:0,Total:0,persons:[]};
    map[k].Accepted+=p.Accepted;map[k].Pending+=p.Pending;map[k].Cancelled+=p.Cancelled;
    map[k].Rejected+=p.Rejected;map[k].Rescheduled+=p.Rescheduled;map[k].Total+=p.Total;
    map[k].persons.push(p);
  });
  return Object.values(map);
}
function buildMeetingSummary(data){
  var acc=0,pen=0,can=0,rej=0,tot=0;
  data.forEach(function(p){acc+=p.Accepted;pen+=p.Pending;can+=p.Cancelled;rej+=p.Rejected;tot+=p.Total;});
  var comps=new Set(data.map(function(p){return p.company;})).size;
  document.getElementById('meeting-summary').innerHTML=
    '<div class="metric"><div class="metric-label">Total citas</div><div class="metric-value">'+tot+'</div></div>'+
    '<div class="metric"><div class="metric-label">Aceptadas</div><div class="metric-value green">'+acc+'</div></div>'+
    '<div class="metric"><div class="metric-label">Pendientes</div><div class="metric-value amber">'+pen+'</div></div>'+
    '<div class="metric"><div class="metric-label">Canceladas</div><div class="metric-value red">'+can+'</div></div>'+
    '<div class="metric"><div class="metric-label">Rechazadas</div><div class="metric-value red">'+rej+'</div></div>'+
    '<div class="metric"><div class="metric-label">Participantes</div><div class="metric-value blue">'+data.length+'</div></div>'+
    '<div class="metric"><div class="metric-label">Empresas</div><div class="metric-value">'+comps+'</div></div>';
}
function tagCls(g){
  if(g==='Sponsor 10x') return 'tag-sp10';
  if(g==='Sponsor 15X') return 'tag-sp15';
  if(g==='Buyer') return 'tag-buyer';
  return 'tag-biz';
}
function sortList(arr,byCompany){
  var s=document.getElementById('sortSelect').value;
  return arr.slice().sort(function(a,b){
    if(s==='accepted_desc') return b.Accepted-a.Accepted;
    if(s==='total_desc') return b.Total-a.Total;
    if(s==='pending_desc') return b.Pending-a.Pending;
    if(s==='az') return (byCompany?a.company:a.name).localeCompare(byCompany?b.company:b.name);
    return 0;
  });
}
var currentMeetingTab='g1';
function renderMeetings(){
  var data=currentMeetingTab==='g1'?G1:G2;
  var q=document.getElementById('meetingSearch').value.toLowerCase().trim();
  var gf=document.getElementById('groupFilter').value;
  var filtered=data.filter(function(p){
    return (!q||p.name.toLowerCase().indexOf(q)>=0||p.company.toLowerCase().indexOf(q)>=0)&&(!gf||p.group===gf);
  });
  buildMeetingSummary(filtered);
  var companies=agg(filtered);
  var sorted=sortList(companies,true);
  document.getElementById('meetingResultCount').textContent=sorted.length+' empresa'+(sorted.length!==1?'s':'')+', '+filtered.length+' participante'+(filtered.length!==1?'s':'');
  var el=document.getElementById('meetingContent');
  if(!sorted.length){el.innerHTML='<div class="empty">Sin resultados.</div>';return;}
  var out='';
  sorted.forEach(function(c){
    var k=c.company+'||'+c.group;
    var open=openMap['m_'+k]===true;
    var persons=sortList(c.persons,false);
    var pills='<span class="pill pill-a">&#10003; '+c.Accepted+' acep.</span>'+
      '<span class="pill pill-p">&#8987; '+c.Pending+' pend.</span>'+
      (c.Cancelled>0?'<span class="pill pill-c">&#x2715; '+c.Cancelled+' canc.</span>':'')+
      (c.Rejected>0?'<span class="pill pill-r">&#x2717; '+c.Rejected+' rech.</span>':'')+
      '<span class="pill pill-t">'+c.Total+' total</span>';
    var rows='';
    if(open){persons.forEach(function(p){rows+='<tr><td>'+p.name+'</td><td class="num num-a">'+p.Accepted+'</td><td class="num num-p">'+p.Pending+'</td><td class="num num-c">'+p.Cancelled+'</td><td class="num num-r">'+p.Rejected+'</td><td class="num" style="font-weight:600">'+p.Total+'</td></tr>';});}
    var sk=k.replace(/\\/g,'\\\\').replace(/'/g,"\\'");
    out+='<div class="company-card">'+
      '<div class="company-header" onclick="toggleCard(\'m_'+sk+'\')">'+
        '<div class="company-left"><div class="company-name">'+c.company+'<span class="group-tag '+tagCls(c.group)+'">'+c.group+'</span></div>'+
        '<div class="company-sub">'+c.persons.length+' participante'+(c.persons.length!==1?'s':'')+'</div></div>'+
        '<div class="pills">'+pills+'</div>'+
        '<span class="chevron'+(open?' open':'')+'">&#9662;</span>'+
      '</div>'+
      (open?'<div class="persons-wrap"><table><thead><tr><th>Participante</th><th class="num">Acep.</th><th class="num">Pend.</th><th class="num">Canc.</th><th class="num">Rech.</th><th class="num">Total</th></tr></thead><tbody>'+rows+'</tbody></table></div>':'')+
    '</div>';
  });
  el.innerHTML=out;
}
function switchMeetingTab(tab){
  currentMeetingTab=tab;
  document.getElementById('meetingSearch').value='';
  document.getElementById('groupFilter').value='';
  var btns=document.querySelectorAll('.mtab-btn');
  btns[0].classList.toggle('active',tab==='g1');
  btns[1].classList.toggle('active',tab==='g2');
  var gf=document.getElementById('groupFilter');
  gf.innerHTML='<option value="">Todos los grupos</option>';
  if(tab==='g1'){
    ['Business','Sponsor 10x','Sponsor 15X'].forEach(function(g){var o=document.createElement('option');o.value=g;o.textContent=g;gf.appendChild(o);});
    gf.style.display='';
  } else {
    gf.style.display='none';
  }
  renderMeetings();
}

/* ===== RSVP ===== */
function fillColor(pct){
  if(pct>=90) return '#dc2626';
  if(pct>=70) return '#d97706';
  return '#16a34a';
}
function statusBadge(pct){
  if(pct>=100) return '<span class="status-badge status-full">LLENO</span>';
  if(pct>=80) return '<span class="status-badge status-almost">Casi lleno</span>';
  return '<span class="status-badge status-open">Disponible</span>';
}
function gpillClass(g){
  var gl=g.toLowerCase();
  if(gl==='buyer') return 'gpill-buyer';
  if(gl==='business') return 'gpill-biz';
  if(gl==='sponsor 15x') return 'gpill-sp15';
  if(gl==='sponsor 10x') return 'gpill-sp10';
  if(gl==='staff') return 'gpill-staff';
  return 'gpill-other';
}
function buildRsvpSummary(events){
  var totalReg=0,totalCap=0,full=0;
  events.forEach(function(e){totalReg+=e.total;totalCap+=e.capacity;if(e.total>=e.capacity)full++;});
  var pctGlobal=totalCap>0?Math.round(totalReg/totalCap*100):0;
  var maxEv=events.slice().sort(function(a,b){return b.total-a.total;})[0];
  document.getElementById('rsvp-summary').innerHTML=
    '<div class="metric"><div class="metric-label">Total reservas</div><div class="metric-value blue">'+totalReg+'</div></div>'+
    '<div class="metric"><div class="metric-label">Capacidad total</div><div class="metric-value">'+totalCap+'</div></div>'+
    '<div class="metric"><div class="metric-label">Llenado global</div><div class="metric-value '+(pctGlobal>=80?'red':pctGlobal>=60?'amber':'green')+'">'+pctGlobal+'%</div></div>'+
    '<div class="metric"><div class="metric-label">Eventos llenos</div><div class="metric-value red">'+full+'</div></div>'+
    '<div class="metric"><div class="metric-label">Total eventos</div><div class="metric-value">'+events.length+'</div></div>'+
    (maxEv?'<div class="metric"><div class="metric-label">Mas reservas</div><div class="metric-value purple">'+maxEv.total+'</div></div>':'');
}
function renderRsvp(){
  var q=document.getElementById('rsvpSearch').value.toLowerCase().trim();
  var bf=document.getElementById('blockFilter').value;
  var sf=document.getElementById('statusFilter').value;
  var filtered=RSVP.filter(function(e){
    var matchQ=!q||e.title.toLowerCase().indexOf(q)>=0;
    var matchB=!bf||e.block===bf;
    var pct=Math.round(e.total/e.capacity*100);
    var matchS=!sf||(sf==='full'&&pct>=100)||(sf==='almost'&&pct>=80&&pct<100)||(sf==='open'&&pct<80);
    return matchQ&&matchB&&matchS;
  });
  buildRsvpSummary(filtered);
  var blocks={};
  filtered.forEach(function(e){
    if(!blocks[e.block]) blocks[e.block]=[];
    blocks[e.block].push(e);
  });
  var blockOrder=['Conferencias 12:50','Conferencias 16:45','Sesiones 18:20\u201318:30','Especiales 14 mayo','Experiencias 15 mayo'];
  var el=document.getElementById('rsvpContent');
  if(!filtered.length){el.innerHTML='<div class="empty">Sin resultados.</div>';return;}
  var out='';
  blockOrder.forEach(function(b){
    if(!blocks[b]) return;
    var evs=blocks[b].slice().sort(function(a,b2){return b2.total-a.total;});
    out+='<div class="block-title">'+b+' &mdash; '+evs.length+' evento'+(evs.length!==1?'s':'')+'</div>';
    evs.forEach(function(e){
      var pct=Math.round(e.total/e.capacity*100);
      var open=openMap['r_'+e.id]===true;
      var groupPills='';
      var gkeys=Object.keys(e.groups).sort(function(a,b2){return e.groups[b2]-e.groups[a];});
      gkeys.forEach(function(g){groupPills+='<span class="gpill '+gpillClass(g)+'">'+g+' '+e.groups[g]+'</span>';});
      var rows='';
      if(open){
        var sorted=e.attendees.slice().sort(function(a,b2){return a.name.localeCompare(b2.name);});
        sorted.forEach(function(a){
          rows+='<tr><td>'+a.name+'</td><td>'+a.company+'</td><td>'+a.title+'</td><td><span class="gpill '+gpillClass(a.group)+'">'+a.group+'</span></td></tr>';
        });
      }
      out+='<div class="event-card">'+
        '<div class="event-header" onclick="toggleCard(\'r_'+e.id+'\')">'+
          '<div class="event-left">'+
            '<div class="event-name">'+e.title+'</div>'+
            '<div class="event-meta">'+e.time+' &nbsp;&middot;&nbsp; '+e.date+'&nbsp;&middot;&nbsp;'+
            '<span style="margin-left:4px">'+groupPills+'</span></div>'+
          '</div>'+
          '<div class="fill-wrap">'+
            '<div class="fill-bar-bg"><div class="fill-bar" style="width:'+Math.min(pct,100)+'%;background:'+fillColor(pct)+'"></div></div>'+
            '<span class="fill-label" style="color:'+fillColor(pct)+'">'+e.total+'/'+e.capacity+'</span>'+
            '<span style="font-size:11px;color:#888;">('+pct+'%)</span>'+
          '</div>'+
          statusBadge(pct)+
          '<span class="chevron'+(open?' open':'')+'">&#9662;</span>'+
        '</div>'+
        (open?'<div class="persons-wrap"><table><thead><tr><th>Nombre</th><th>Empresa</th><th>Cargo</th><th>Grupo</th></tr></thead><tbody>'+rows+'</tbody></table></div>':'')+
      '</div>';
    });
  });
  el.innerHTML=out;
}

function toggleCard(k){openMap[k]=!openMap[k];if(k.charAt(0)==='m')renderMeetings();else renderRsvp();}

/* ===== MAIN NAV ===== */
function switchMainTab(tab){
  currentMainTab=tab;
  ['meetings','rsvp'].forEach(function(t){
    document.getElementById('tab-'+t).classList.toggle('active',t===tab);
    document.getElementById('panel-'+t).style.display=t===tab?'block':'none';
  });
  if(tab==='meetings') switchMeetingTab(currentMeetingTab);
  else renderRsvp();
}

/* init */
switchMeetingTab('g1');
renderRsvp();

</script>
