function buildRegCard(title, color, data, byGroup, mainGrp){
  var pct=data.total>0?Math.round(data.joined/data.total*100):0;
  var subGroups = mainGrp==='Buyer'
    ? [['Buyer',byGroup['Buyer']]]
    : [['Business',byGroup['Business']],['Sponsor 15X',byGroup['Sponsor 15X']],['Sponsor 10x',byGroup['Sponsor 10x']],['Associate',byGroup['Associate']],['Attendees',byGroup['Attendees']]];

  var subHtml='<div class="sub-grid">';
  subGroups.forEach(function(sg){
    var g=sg[0]; var d=sg[1];
    if(!d||d.total===0) return;
    var cls=g==='Buyer'?'gtag-buyer':g==='Business'?'gtag-biz':g==='Sponsor 10x'?'gtag-sp10':g==='Sponsor 15X'?'gtag-sp15':'gtag-assoc';
    subHtml+='<div class="sg"><div class="sg-label"><span class="gtag '+cls+'">'+g+'</span></div>'+
      '<div class="sg-val">'+d.total+'</div>'+
      '<div class="sg-sub">'+d.joined+' activos &middot; '+d.invited+' inactivos</div></div>';
  });
  subHtml+='</div>';

  // Inactive list
  var inactList=DASH.inactive[title]||[];
  var inactHtml='';
  if(inactList.length>0){
    var showing=inactiveOpen[title];
    var tagCls=function(g){return g==='Buyer'?'gtag-buyer':g==='Business'?'gtag-biz':g==='Sponsor 10x'?'gtag-sp10':g==='Sponsor 15X'?'gtag-sp15':'gtag-assoc';};
    inactHtml='<div class="divider"></div>'+
      '<div style="display:flex;align-items:center;justify-content:space-between;">'+
        '<span style="font-size:11px;color:#b91c1c;font-weight:600;">&#9888; '+inactList.length+' sin activar</span>'+
        '<button class="inactive-toggle" onclick="toggleInactive(\''+title+'\')">'+
          (showing?'Ocultar lista':'Ver lista')+'</button>'+
      '</div>';
    if(showing){
      inactHtml+='<table class="inactive-table"><thead><tr><th>Nombre</th><th>Empresa</th><th>Grupo</th><th>C\u00f3digo</th></tr></thead><tbody>';
      inactList.forEach(function(u){
        var cls=tagCls(u.group);
        inactHtml+='<tr><td>'+u.name+'</td><td>'+u.company+'</td>'+
          '<td><span class="gtag '+cls+'">'+u.group+'</span></td>'+
          '<td style="font-family:monospace;font-size:11px;color:#555;">'+u.token+'</td></tr>';
      });
      inactHtml+='</tbody></table>';
    }
  }

  return '<div class="card-title" style="color:'+color+';">'+title.toUpperCase()+
    '<span style="font-size:20px;font-weight:700;color:#1a1a1a;">'+data.total+' participantes</span></div>'+
    '<div class="stat-row">'+
      '<div class="stat-box"><div class="stat-label">Activos</div><div class="stat-val green">'+data.joined+'</div></div>'+
      '<div class="stat-box"><div class="stat-label">Inactivos</div><div class="stat-val red">'+data.invited+'</div></div>'+
      '<div class="stat-box"><div class="stat-label">% Activo</div><div class="stat-val '+(pct>=80?'green':pct>=60?'amber':'red')+'">'+pct+'%</div></div>'+
    '</div>'+
    '<div class="divider"></div>'+
    subHtml+
    inactHtml;
}

function toggleInactive(group){
  inactiveOpen[group]=!inactiveOpen[group];
  renderOverview();
}

function buildGoalRanking(data, title, color){
  var rows='';
  data.slice(0,15).forEach(function(c,i){
    var pct=Math.min(c.pct,100);
    var barColor=c.accepted>=20?'#15803d':c.accepted>=15?'#d97706':'#3b82f6';
    var bdg=c.accepted>=20?'<span class="badge badge-hit">&#10003; META</span>':
            c.accepted>=15?'<span class="badge badge-near">'+c.accepted+'/20</span>':'';
    rows+='<div class="rank-row">'+
      '<span class="rank-pos">'+(i+1)+'</span>'+
      '<span class="rank-name" title="'+c.company+'">'+c.company+bdg+'</span>'+
      '<div class="rank-bar-bg"><div class="rank-bar" style="width:'+pct+'%;background:'+barColor+'"></div></div>'+
      '<span class="rank-val" style="color:'+barColor+'">'+c.accepted+'</span>'+
    '</div>';
  });
  return '<div class="card-title" style="color:'+color+';">'+title+'</div>'+rows;
}

function buildRsvpRanking(){
  var rows='';
  DASH.rsvp_ranking.slice(0,15).forEach(function(e,i){
    var pct=Math.min(e.pct,100);
    var barColor=e.pct>=100?'#dc2626':e.pct>=80?'#d97706':'#16a34a';
    var bdg=e.pct>=100?'<span class="badge badge-full">LLENO</span>':
            e.pct>=80?'<span class="badge badge-almost">Casi lleno</span>':'';
    rows+='<div class="rank-row">'+
      '<span class="rank-pos">'+(i+1)+'</span>'+

      '<div class="rank-bar-bg"><div class="rank-bar" style="width:'+pct+'%;background:'+barColor+'"></div></div>'+
      '<span class="rank-val" style="color:'+barColor+'">'+e.total+'/'+e.capacity+'</span>'+
    '</div>';
  });
  return '<div class="card-title">RSVP &#8212; Ranking por % de llenado</div>'+rows;
}

/* ── MEETINGS ── */
function agg(persons){
  var map={};
  persons.forEach(function(p){
    var k=p.company+'||'+p.group;
    if(!map[k]) map[k]={company:p.company,group:p.group,Accepted:0,Pending:0,Cancelled:0,Rejected:0,Rescheduled:0,Total:0,persons:[]};
    map[k].Accepted+=p.Accepted;map[k].Pending+=p.Pending;map[k].Cancelled+=p.Cancelled;
    map[k].Rejected+=p.Rejected;map[k].Rescheduled+=p.Rescheduled;map[k].Total+=p.Total;
    map[k].persons.push(p);
  });
  return Object.values(map);
}
function buildMeetingSummary(data){
  var acc=0,pen=0,can=0,rej=0,tot=0;
  data.forEach(function(p){acc+=p.Accepted;pen+=p.Pending;can+=p.Cancelled;rej+=p.Rejected;tot+=p.Total;});
  var comps=new Set(data.map(function(p){return p.company;})).size;
  document.getElementById('meeting-summary').innerHTML=
    '<div class="metric"><div class="metric-label">Total citas</div><div class="metric-value">'+tot+'</div></div>'+
    '<div class="metric"><div class="metric-label">Aceptadas</div><div class="metric-value green">'+acc+'</div></div>'+
    '<div class="metric"><div class="metric-label">Pendientes</div><div class="metric-value amber">'+pen+'</div></div>'+
    '<div class="metric"><div class="metric-label">Canceladas</div><div class="metric-value red">'+can+'</div></div>'+
    '<div class="metric"><div class="metric-label">Rechazadas</div><div class="metric-value red">'+rej+'</div></div>'+
    '<div class="metric"><div class="metric-label">Participantes</div><div class="metric-value blue">'+data.length+'</div></div>'+
    '<div class="metric"><div class="metric-label">Empresas</div><div class="metric-value">'+comps+'</div></div>';
}
function tagCls(g){
  if(g==='Sponsor 10x') return 'tag-sp10';
  if(g==='Sponsor 15X') return 'tag-sp15';
  if(g==='Buyer') return 'tag-buyer';
  return 'tag-biz';
}
function sortList(arr,byCompany){
  var s=document.getElementById('sortSelect').value;
  return arr.slice().sort(function(a,b){
    if(s==='accepted_desc') return b.Accepted-a.Accepted;
    if(s==='total_desc') return b.Total-a.Total;
    if(s==='pending_desc') return b.Pending-a.Pending;
    if(s==='az') return (byCompany?a.company:a.name).localeCompare(byCompany?b.company:b.name);
    return 0;
  });
}
function renderMeetings(){
  var data=currentMeetingTab==='g1'?G1:G2;
  var q=document.getElementById('meetingSearch').value.toLowerCase().trim();
  var gf=document.getElementById('groupFilter').value;
  var filtered=data.filter(function(p){
    return(!q||p.name.toLowerCase().indexOf(q)>=0||p.company.toLowerCase().indexOf(q)>=0)&&(!gf||p.group===gf);
  });
  buildMeetingSummary(filtered);
  var sorted=sortList(agg(filtered),true);
  document.getElementById('meetingResultCount').textContent=sorted.length+' empresa'+(sorted.length!==1?'s':'')+', '+filtered.length+' participante'+(filtered.length!==1?'s':'');
  var el=document.getElementById('meetingContent');
  if(!sorted.length){el.innerHTML='<div class="empty">Sin resultados.</div>';return;}
  var out='';
  sorted.forEach(function(c){
    var k=c.company+'||'+c.group;
    var open=openMap['m_'+k]===true;
    var persons=sortList(c.persons,false);
    var pills='<span class="pill pill-a">&#10003; '+c.Accepted+' acep.</span>'+
      '<span class="pill pill-p">&#8987; '+c.Pending+' pend.</span>'+
      (c.Cancelled>0?'<span class="pill pill-c">&#x2715; '+c.Cancelled+' canc.</span>':'')+
      (c.Rejected>0?'<span class="pill pill-r">&#x2717; '+c.Rejected+' rech.</span>':'')+
      '<span class="pill pill-t">'+c.Total+' total</span>';
    var rows='';
    if(open){persons.forEach(function(p){rows+='<tr><td>'+p.name+'</td><td class="num num-a">'+p.Accepted+'</td><td class="num num-p">'+p.Pending+'</td><td class="num num-c">'+p.Cancelled+'</td><td class="num num-r">'+p.Rejected+'</td><td class="num" style="font-weight:600">'+p.Total+'</td></tr>';});}
    var sk=k.replace(/\\/g,'\\\\').replace(/'/g,"\\'");
    out+='<div class="company-card">'+
      '<div class="company-header" onclick="toggleCard(\'m_'+sk+'\')">'+
        '<div class="company-left"><div class="company-name">'+c.company+'<span class="group-tag '+tagCls(c.group)+'">'+c.group+'</span></div>'+
        '<div class="company-sub">'+c.persons.length+' participante'+(c.persons.length!==1?'s':'')+'</div></div>'+
        '<div class="pills">'+pills+'</div>'+
        '<span class="chevron'+(open?' open':'')+'">&#9662;</span>'+
      '</div>'+
      (open?'<div class="persons-wrap"><table><thead><tr><th>Participante</th><th class="num">Acep.</th><th class="num">Pend.</th><th class="num">Canc.</th><th class="num">Rech.</th><th class="num">Total</th></tr></thead><tbody>'+rows+'</tbody></table></div>':'')+
    '</div>';
  });
  el.innerHTML=out;
}
function switchMeetingTab(tab){
  currentMeetingTab=tab;
  document.getElementById('meetingSearch').value='';
  document.getElementById('groupFilter').value='';
  var btns=document.querySelectorAll('.mtab-btn');
  btns[0].classList.toggle('active',tab==='g1');
  btns[1].classList.toggle('active',tab==='g2');
  var gf=document.getElementById('groupFilter');
  gf.innerHTML='<option value="">Todos los grupos</option>';
  if(tab==='g1'){
    ['Business','Sponsor 10x','Sponsor 15X'].forEach(function(g){var o=document.createElement('option');o.value=g;o.textContent=g;gf.appendChild(o);});
    gf.style.display='';
  } else { gf.style.display='none'; }
  renderMeetings();
}

/* ── RSVP ── */
function fillColor(pct){return pct>=90?'#dc2626':pct>=70?'#d97706':'#16a34a';}
function gpillCls(g){
  var gl=g.toLowerCase();
  if(gl==='buyer') return 'gpill-buyer';
  if(gl==='business') return 'gpill-biz';
  if(gl==='sponsor 15x') return 'gpill-sp15';
  if(gl==='sponsor 10x') return 'gpill-sp10';
  return 'gpill-other';
}
function buildRsvpSummary(events){
  var totalReg=0,totalCap=0,full=0;
  events.forEach(function(e){totalReg+=e.total;totalCap+=e.capacity;if(e.total>=e.capacity)full++;});
  var pct=totalCap>0?Math.round(totalReg/totalCap*100):0;
  document.getElementById('rsvp-summary').innerHTML=
    '<div class="metric"><div class="metric-label">Total reservas</div><div class="metric-value blue">'+totalReg+'</div></div>'+
    '<div class="metric"><div class="metric-label">Capacidad total</div><div class="metric-value">'+totalCap+'</div></div>'+
    '<div class="metric"><div class="metric-label">Llenado global</div><div class="metric-value '+(pct>=80?'red':pct>=60?'amber':'green')+'">'+pct+'%</div></div>'+
    '<div class="metric"><div class="metric-label">Eventos llenos</div><div class="metric-value red">'+full+'</div></div>'+
    '<div class="metric"><div class="metric-label">Total eventos</div><div class="metric-value">'+events.length+'</div></div>';
}
function renderRsvp(){
  var q=document.getElementById('rsvpSearch').value.toLowerCase().trim();
  var bf=document.getElementById('blockFilter').value;
  var sf=document.getElementById('statusFilter').value;
  var filtered=RSVP.filter(function(e){
    var pct=e.pct;
    return(!q||e.title.toLowerCase().indexOf(q)>=0)&&(!bf||e.block===bf)&&
      (!sf||(sf==='full'&&pct>=100)||(sf==='almost'&&pct>=80&&pct<100)||(sf==='open'&&pct<80));
  });
  buildRsvpSummary(filtered);
  var blocks={};
  filtered.forEach(function(e){if(!blocks[e.block])blocks[e.block]=[];blocks[e.block].push(e);});
  var blockOrder=['Conferencias 12:50','Conferencias 16:45','Sesiones 18:20\u201318:30','Especiales 14 mayo','Experiencias 15 mayo'];
  var el=document.getElementById('rsvpContent');
  if(!filtered.length){el.innerHTML='<div class="empty">Sin resultados.</div>';return;}
  var out='';
  blockOrder.forEach(function(b){
    if(!blocks[b]) return;
    var evs=blocks[b].slice().sort(function(a,b2){return b2.pct-a.pct;});
    out+='<div class="block-title">'+b+' &mdash; '+evs.length+' evento'+(evs.length!==1?'s':'')+'</div>';
    evs.forEach(function(e){
      var pct=Math.min(e.pct,100);
      var open=openMap['r_'+e.id]===true;
      var gkeys=Object.keys(e.groups).sort(function(a,b2){return e.groups[b2]-e.groups[a];});
      var gpills=gkeys.map(function(g){return '<span class="gpill '+gpillCls(g)+'">'+g+' '+e.groups[g]+'</span>';}).join(' ');
      var rows='';
      if(open){
        e.attendees.slice().sort(function(a,b2){return a.name.localeCompare(b2.name);}).forEach(function(a){
          rows+='<tr><td>'+a.name+'</td><td>'+a.company+'</td><td>'+a.title+'</td><td><span class="gpill '+gpillCls(a.group)+'">'+a.group+'</span></td></tr>';
        });
      }
      var sbdg=e.pct>=100?'<span class="badge badge-full">LLENO</span>':e.pct>=80?'<span class="badge badge-almost">Casi lleno</span>':'<span class="badge badge-open">Disponible</span>';
      out+='<div class="event-card">'+
        '<div class="event-header" onclick="toggleCard(\'r_'+e.id+'\')">'+
          '<div class="event-left"><div class="event-name">'+e.title+'</div>'+
          '<div class="event-meta">'+e.time+' &middot; '+e.date+'&nbsp;'+gpills+'</div></div>'+
          '<div class="fill-wrap">'+
            '<div class="fill-bar-bg"><div class="fill-bar" style="width:'+pct+'%;background:'+fillColor(e.pct)+'"></div></div>'+
            '<span class="fill-label" style="color:'+fillColor(e.pct)+'">'+e.total+'/'+e.capacity+'</span>'+
            '<span style="font-size:11px;color:#888">('+e.pct+'%)</span>'+
          '</div>'+sbdg+
          '<span class="chevron'+(open?' open':'')+'">&#9662;</span>'+
        '</div>'+
        (open?'<div class="persons-wrap"><table><thead><tr><th>Nombre</th><th>Empresa</th><th>Cargo</th><th>Grupo</th></tr></thead><tbody>'+rows+'</tbody></table></div>':'')+
      '</div>';
    });
  });
  el.innerHTML=out;
}

function toggleCard(k){openMap[k]=!openMap[k];if(k.charAt(0)==='m')renderMeetings();else renderRsvp();}

function switchMainTab(tab){
  currentMainTab=tab;
  ['overview','meetings','rsvp','agendas'].forEach(function(t){
    document.getElementById('tab-'+t).classList.toggle('active',t===tab);
    document.getElementById('panel-'+t).style.display=t===tab?'block':'none';
  });
  if(tab==='overview') renderOverview();
  else if(tab==='meetings') switchMeetingTab(currentMeetingTab);
  else if(tab==='agendas') renderAgendas();
  else renderRsvp();
}

function renderAgendas(){
  var q=document.getElementById('agendaSearch').value.toLowerCase().trim();
  var gf=document.getElementById('agendaGroupFilter').value;
  var filtered=AGENDAS.filter(function(a){
    return(!q||a.name.toLowerCase().indexOf(q)>=0||a.company.toLowerCase().indexOf(q)>=0)&&(!gf||a.group===gf);
  });
  document.getElementById('agendaCount').textContent=filtered.length+' participante'+(filtered.length!==1?'s':'');
  var el=document.getElementById('agendaContent');
  if(!filtered.length){el.innerHTML='<div class="empty">Sin resultados.</div>';return;}

  // Group by company
  var byCompany={};

    var k=a.company+'||'+a.group;
    if(!byCompany[k]) byCompany[k]={company:a.company,group:a.group,persons:[]};

  });

    out+='</div>';
    c.persons.forEach(function(a){
      out+='<div style="display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid #f7f7f6;">';
      out+='<div style="flex:1;min-width:0;">';
      out+='<div style="font-size:13px;font-weight:500;">'+a.name+'</div>';
      out+='<div style="font-size:11px;color:#888;margin-top:2px;">'+a.meetings.length+' cita'+(a.meetings.length!==1?'s':'')+' aceptada'+(a.meetings.length!==1?'s':'')+'</div>';

      out+='</div>';
    });
    out+='</div>';
  });
  el.innerHTML=out;
}

function printAgenda(personName){
  var agenda=null;
  for(var i=0;i<AGENDAS.length;i++){if(AGENDAS[i].name===personName){agenda=AGENDAS[i];break;}}
  if(!agenda) return;

  var groupColor=agenda.group==='Buyer'?'#1e3a8a':agenda.group==='Business'?'#374151':agenda.group==='Sponsor 15X'?'#065f46':'#4c1d95';

    var bg=idx%2===0?'#ffffff':'#f9f9f8';

        '<span style="font-size:10px;font-weight:600;padding:2px 8px;border-radius:99px;background:'+(m.counterpart_group==='Buyer'?'#dbeafe':'#f3f4f6')+';color:'+(m.counterpart_group==='Buyer'?'#1e3a8a':'#374151')+';">'+m.counterpart_group+'</span>'+
      '</td>'+
    '</tr>';
  });

  var html='<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Agenda - '+agenda.name+'</title>'+
    '<style>'+
    '*{box-sizing:border-box;margin:0;padding:0;}'+
    'body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#1a1a1a;}'+
    '.header{background:#1a1a1a;color:#fff;padding:32px 40px;}'+
    '.header h1{font-size:22px;font-weight:700;margin-bottom:4px;}'+
    '.header p{font-size:13px;opacity:.7;}'+
    '.pill{display:inline-block;font-size:11px;font-weight:700;padding:3px 10px;border-radius:99px;background:'+groupColor+';color:#fff;margin-top:8px;}'+
    '.body{padding:32px 40px;}'+
    '.label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#888;margin-bottom:14px;}'+
    'table{width:100%;border-collapse:collapse;}'+
    'th{text-align:left;padding:8px 14px;font-size:10px;font-weight:700;color:#888;text-transform:uppercase;letter-spacing:.04em;background:#f5f5f3;border-bottom:2px solid #e5e5e3;}'+
    '.footer{margin-top:32px;padding-top:16px;border-top:1px solid #e5e5e3;font-size:11px;color:#aaa;display:flex;justify-content:space-between;}'+
    '@media print{body{-webkit-print-color-adjust:exact;print-color-adjust:exact;}}'+
    '</style></head><body>'+
    '<div class="header">'+
      '<h1>'+agenda.name+'</h1>'+
      '<p>'+agenda.company+'</p>'+
      '<span class="pill">'+agenda.group+'</span>'+
    '</div>'+
    '<div class="body">'+
      '<div class="label">Citas Aceptadas &mdash; C12HUB 2026 &nbsp;&middot;&nbsp; '+agenda.meetings.length+' cita'+(agenda.meetings.length!==1?'s':'')+'</div>'+
      '<table>'+
        '<thead><tr><th>#</th><th>Nombre</th><th>Empresa</th><th>Grupo</th></tr></thead>'+
        '<tbody>'+rows+'</tbody>'+
      '</table>'+
      '<div class="footer">'+
        '<span>C12HUB 2026 &mdash; Agenda generada 6 mayo 2026</span>'+
        '<span>'+agenda.meetings.length+' cita'+(agenda.meetings.length!==1?'s aceptadas':'  aceptada')+'</span>'+
      '</div>'+
    '</div>'+
    '</body></html>';

  // Use Blob URL to avoid popup blocker
  var blob=new Blob([html],{type:'text/html'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');
  a.href=url;
  a.download='Agenda_'+agenda.name.replace(/\s+/g,'_')+'_C12HUB2026.html';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(function(){URL.revokeObjectURL(url);},1000);
}
